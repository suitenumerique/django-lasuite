name: Test Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  checks: write

jobs:

  lint-git:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Makes sense only for pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: show
        run: git log
      - name: Check absence of fixup commits
        run: |
          ! git log | grep 'fixup!'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint commit messages added to main
        run: uvx --with requests gitlint --commits origin/${{ github.event.pull_request.base.ref }}..HEAD

  check-changelog:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'noChangeLog') == false &&
      github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check that the CHANGELOG has been modified in the current branch
        run: git log --name-only --pretty="" origin/${{ github.event.pull_request.base.ref }}..HEAD | grep CHANGELOG

  lint-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check CHANGELOG max line length
        run: |
          max_line_length=$(cat CHANGELOG.md | grep -Ev "^\[.*\]: https://github.com" | wc -L)
          if [ $max_line_length -ge 80 ]; then
            echo "ERROR: CHANGELOG has lines longer than 80 characters."
            exit 1
          fi


  lint-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that uv.lock is up to date
        run: uv lock --check
      - name: Install development dependencies
        run: uv sync --locked --no-build --no-install-project
      - name: Check code formatting with ruff
        run: uv run --no-sync --no-build ruff format . --diff
      - name: Lint code with ruff
        run: uv run --no-sync --no-build ruff check .

  check-extras:
    name: check extra ${{ matrix.extra || 'none' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: ""
            apps: admin tools
          - extra: configuration
            apps: configuration
          - extra: audit
            apps: audit
          - extra: drf
            apps: drf
          - extra: malware-detection
            apps: malware_detection
          - extra: marketing
            apps: marketing
          - extra: oidc-login
            apps: oidc_login
          - extra: oidc-resource-server
            apps: oidc_resource_server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import the applications with only their extra installed
        run: >
          uv run --isolated --no-project --python 3.14
          --with ".${{ matrix.extra && format('[{0}]', matrix.extra) || '' }}"
          python -I scripts/check_extra_imports.py ${{ matrix.apps }}

  test-pytest:
    name: test with python ${{ matrix.python }}, django ${{ matrix.django }}, mozilla-django-oidc ${{ matrix.mozoidc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        mozoidc: ["4", "5"]
        exclude:
          # Django 6.0+ requires Python 3.12+
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run test suite
        run: >
          uv run --locked --python ${{ matrix.python }}
          --with "django~=${{ matrix.django }}.0"
          --with "mozilla-django-oidc~=${{ matrix.mozoidc }}.0"
          pytest --junitxml=junit.xml
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Test Results (python ${{ matrix.python }}, django ${{ matrix.django }}, mozilla-django-oidc ${{ matrix.mozoidc }})
          path: junit.xml
          reporter: java-junit
